# Local development stack for Seamap.
#
#   docker compose up
#
# Backend (Django dev server):  http://localhost:8000
# Frontend (shadow-cljs):       http://localhost:3451   (nREPL on 8777)
# WordPress (story maps, region reports): http://localhost:8888  (admin/admin)
#
# The backend connects to the *remote* SQL Server configured via environment
# variables. Copy .env.example to .env and fill in the DB host/credentials
# before starting; the container seeds webapp/local_settings.py (gitignored)
# from the env-driven template on first run.
# If the DB is on the UTAS network, the host must be on the VPN.

services:
  backend:
    build: ./backend
    # Live code reload: source is mounted over the image's /app.
    # Installed Python packages live in site-packages, so they survive the mount.
    volumes:
      - ./backend:/app
      # Keep the heavy SQL Server schema/etl tree reachable from settings.
      - ./database:/database
    ports:
      - "8000:8000"
    # DB credentials and other config; webapp/local_settings.py reads these.
    # Optional so compose still runs before setup — the settings template falls
    # back to placeholder defaults (which won't reach a real DB).
    env_file:
      - path: .env
        required: false
    # Re-stated here for clarity; matches manage.py's default.
    environment:
      DJANGO_SETTINGS_MODULE: webapp.local_settings
      # Server-side calls (e.g. retrieve_squidle_annotations_data) reach WP
      # over the compose network, not via the host's localhost:8888.
      WORDPRESS_URL: "${WORDPRESS_URL:-http://wordpress/}"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Named volumes shadow the bind mount so the image's node_modules and
      # the Maven/Clojure dep cache aren't clobbered by the host tree.
      - frontend_node_modules:/app/node_modules
      - frontend_m2:/root/.m2
      # So `yarn build-region-report-css` can write ../wordpress/plugins/...
      - ./wordpress:/wordpress
    ports:
      - "3451:3451"  # shadow-cljs dev http
      - "8777:8777"  # shadow-cljs nREPL
      - "9630:9630"  # shadow-cljs server: hot-reload websocket + dashboard
    environment:
      # File events from a Windows/macOS host don't reach the container through
      # the bind mount, so poll for changes instead (hot reload). Merged over
      # shadow-cljs.edn, so it only affects Docker.
      SHADOW_CLJS: "{:fs-watch {:impl :polling}}"
    command: yarn watch

  # ── WordPress ──────────────────────────────────────────────────────────────
  # Hosts the story_map and region_report post types (wordpress/plugins/*).
  # The frontend reads story maps from /wp-json/wp/v2/story_map and links to
  # /region-reports/<slug>/ pages, which call back into the backend API.
  wp-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - wp_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:6-apache
    depends_on:
      wp-db:
        condition: service_healthy
    environment: &wp-env
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    ports:
      - "8888:80"  # the frontend's wordpress_url_base defaults to localhost:8888
    volumes:
      # WP core, uploads, and any plugins/themes installed via wp-admin
      # (e.g. the H-Code parent theme) persist in this named volume.
      - wp_data:/var/www/html
      # Repo plugins/theme are overlaid read-only; edits show up on reload.
      - ./wordpress/plugins/story-map:/var/www/html/wp-content/plugins/story-map:ro
      - ./wordpress/plugins/region-report:/var/www/html/wp-content/plugins/region-report:ro
      - ./wordpress/plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro:ro
      - ./wordpress/themes/h-code-child:/var/www/html/wp-content/themes/h-code-child:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/wp-login.php || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: pulls ACF Pro (paid, not in git) from a private IMAS release into
  # wordpress/plugins/advanced-custom-fields-pro/. Skips cleanly if it's already
  # there or ACF_GITHUB_TOKEN is unset (wp-init then uses Secure Custom Fields).
  acf-fetch:
    image: alpine:3.20
    environment:
      GITHUB_TOKEN: "${ACF_GITHUB_TOKEN:-}"
      ACF_PRO_REPO: "${ACF_PRO_REPO:-IMASau/seamap-vendor}"
      ACF_PRO_RELEASE_TAG: "${ACF_PRO_RELEASE_TAG:-acf-pro-6.8.0.1}"
      ACF_PRO_ASSET: "${ACF_PRO_ASSET:-advanced-custom-fields-pro.zip}"
    volumes:
      - ./wordpress/plugins/advanced-custom-fields-pro:/dest
      - ./wordpress/init:/init:ro
    entrypoint: ["sh", "/init/fetch-acf-pro.sh"]
    restart: "no"

  # One-shot, idempotent wp-cli setup: install, permalinks, plugins, theme,
  # region-report URL options. Re-run with `docker compose run --rm wp-init`.
  wp-init:
    image: wordpress:cli
    depends_on:
      wordpress:
        condition: service_healthy
      acf-fetch:
        condition: service_completed_successfully
    user: "33:33"  # www-data in the apache image (the cli image defaults to 82)
    environment:
      <<: *wp-env
      HOME: /tmp  # wp-cli cache dir
      WP_URL: http://localhost:8888
      WP_TITLE: Seamap Local
      WP_ADMIN_USER: "${WP_ADMIN_USER:-admin}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD:-admin}"
      WP_ADMIN_EMAIL: "${WP_ADMIN_EMAIL:-admin@example.com}"
      # Browser-facing URLs written into the region-report options.
      SEAMAP_API_URL: http://localhost:8000/api/
      SEAMAP_MEDIA_URL: http://localhost:8000/media/
      SEAMAP_MAP_URL: http://localhost:3451
    # Same view of wp-content as Apache, or wp-cli can't find the plugins.
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/story-map:/var/www/html/wp-content/plugins/story-map:ro
      - ./wordpress/plugins/region-report:/var/www/html/wp-content/plugins/region-report:ro
      - ./wordpress/plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro:ro
      - ./wordpress/themes/h-code-child:/var/www/html/wp-content/themes/h-code-child:ro
      - ./wordpress/init:/init:ro
    entrypoint: ["sh", "/init/bootstrap.sh"]
    restart: "no"

  # ── Dev API proxy (optional) ───────────────────────────────────────────────
  # Read-only pass-through to the shared dev Seamap API, for running the
  # frontend without a local backend/DB. The dev API sends no CORS headers, so
  # browsers on localhost can't call it directly; this adds them. Only GET/HEAD
  # are forwarded, so nothing can write to the dev database through it.
  #   docker compose --profile dev-api up -d dev-api-proxy
  #   → http://localhost:8001/seamap/api/  (see frontend/resources/public/tmag-kiosk.html)
  dev-api-proxy:
    image: nginx:alpine
    profiles: [dev-api]
    ports:
      - "8001:80"
    configs:
      - source: dev-api-proxy
        target: /etc/nginx/conf.d/default.conf

volumes:
  frontend_node_modules:
  frontend_m2:
  wp_db_data:
  wp_data:

configs:
  dev-api-proxy:
    content: |
      server {
        listen 80;
        location /seamap/ {
          limit_except GET { deny all; }  # GET also allows HEAD
          proxy_pass https://data-dev.imas.utas.edu.au/seamap/;
          proxy_set_header Host data-dev.imas.utas.edu.au;
          proxy_ssl_server_name on;
          proxy_hide_header Access-Control-Allow-Origin;
          add_header Access-Control-Allow-Origin * always;
        }
      }

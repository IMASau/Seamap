# Local-only dev stack. See docs/local-dev-docker.md for the workflow.
#
# Service summary:
#   - mssql     : SQL Server 2022 (amd64 image, runs under Rosetta on Apple Silicon).
#   - dbinit    : one-shot — ensures the DB exists, optionally loads database/*.sql
#                 via LOAD_SCHEMA=1.
#   - geoserver-fetch : one-shot — downloads the latest "master" GeoServer WAR
#                 from IMASau/geoserver-build releases into the geoserver-war
#                 named volume. Idempotent; force-refresh with GEOSERVER_WAR_FORCE_REFRESH=1.
#   - geoserver-config-init : one-shot — seeds the geoserver-data named
#                 volume from a RO bind mount of the user's sibling clone of
#                 IMASau/geoserver-config-imas (default ../geoserver-config-imas;
#                 override via GEOSERVER_CONFIG_PATH). Drops a dev admin user
#                 on top. Run scripts/geoserver-config-clone.sh to populate
#                 the clone first. Force re-seed with GEOSERVER_CONFIG_FORCE_REINIT=1.
#   - geoserver : Tomcat 9 + JRE 17 running the IMAS-built GeoServer WAR
#                 (currently 2.28.0, with AODN extensions — layer-filter, NCWMS,
#                 SqlServer JDBC, CORS patches). Mirrors imas-data-infrastructure's
#                 roles/geoserver/ Ansible deploy.
#   - backend   : Django dev server on :8000 with webapp.docker_settings.
#   - frontend  : shadow-cljs watch on :3451, nREPL on :8777.
#   - wp-db     : MariaDB for WordPress.
#   - wordpress : Apache + WP on :8888 — story-maps + region-reports authoring.
#   - acf-fetch : one-shot — pulls pinned ACF Pro zip from the IMAS vendor
#                 GitHub release into the bind-mounted plugin dir. Gated on
#                 GITHUB_TOKEN; skips cleanly when unset or plugin already
#                 present (preserves the manual-drop escape hatch).
#   - wp-init   : one-shot wp-cli bootstrap (install, activate plugins, permalinks).

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64  # no native arm64 image; Rosetta works for dev.
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SeamapDev123!}"
    ports:
      - "${MSSQL_HOST_PORT:-1435}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C
          -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -Q "SELECT 1" -l 2 -b
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dbinit:
    build:
      context: ./backend
    image: seamap-backend:dev
    # sqlpackage is linux-x64 only; pin to amd64 so both dbinit and backend
    # share the same image. Capture (sqlpackage) and runtime (sqlcmd) both
    # work under Rosetta on Apple Silicon.
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      DB_HOST: mssql
      DB_PORT: "1433"
      DB_NAME: "${DB_NAME:-seamap}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${MSSQL_SA_PASSWORD:-SeamapDev123!}"
      LOAD_SCHEMA: "${LOAD_SCHEMA:-0}"
    volumes:
      - ./database:/database:ro
      - ./backend/docker:/srv/docker:ro
    entrypoint: ["python", "/srv/docker/dbinit.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
    image: seamap-backend:dev
    # See dbinit — shared image, sqlpackage forces linux/amd64.
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
      dbinit:
        condition: service_completed_successfully
    environment:
      DJANGO_SETTINGS_MODULE: webapp.docker_settings
      DB_HOST: mssql
      DB_PORT: "1433"
      DB_NAME: "${DB_NAME:-seamap}"
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${MSSQL_SA_PASSWORD:-SeamapDev123!}"
      USE_SQLITE: "${USE_SQLITE:-0}"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./database:/database:ro
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
    image: seamap-frontend:dev
    ports:
      - "${FRONTEND_HOST_PORT:-3451}:3451"
      - "${FRONTEND_NREPL_PORT:-8777}:8777"
      # shadow-cljs's own HTTP+websocket server. The compiled :dev bundle
      # hard-codes server_port=9630 with use_document_host=true, so the host
      # browser opens ws://localhost:9630/... — must be reachable for hot reload.
      - "${FRONTEND_SHADOW_PORT:-9630}:9630"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-shadow-cache:/app/.shadow-cljs
    command: yarn run watch

  geoserver-fetch:
    # One-shot: downloads the IMAS GeoServer WAR (with AODN extensions) from
    # the latest "master" release of IMASau/geoserver-build into the
    # geoserver-war named volume. Idempotent — skips if the WAR is already
    # cached unless GEOSERVER_WAR_FORCE_REFRESH=1.
    image: alpine:3.20
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GEOSERVER_WAR_REPO: "${GEOSERVER_WAR_REPO:-IMASau/geoserver-build}"
      GEOSERVER_WAR_TAG_FILTER: "${GEOSERVER_WAR_TAG_FILTER:-master}"
      GEOSERVER_WAR_ASSET_PREFIX: "${GEOSERVER_WAR_ASSET_PREFIX:-geoserver}"
      GEOSERVER_WAR_FORCE_REFRESH: "${GEOSERVER_WAR_FORCE_REFRESH:-0}"
    volumes:
      - geoserver-war:/srv/war
      - ./geoserver:/srv/init:ro
    entrypoint: ["/srv/init/fetch-war.sh"]
    restart: "no"

  geoserver-config-init:
    # One-shot: rsync's the user's geoserver-config-imas clone (RO bind mount)
    # into the geoserver-data named volume, then overlays a dev admin user.
    # This keeps the user's git checkout pristine — GeoServer normalises SLDs
    # and writes logs/ into GEOSERVER_DATA_DIR at runtime, which we don't want
    # leaking back into their working tree. Idempotent; force re-seed with
    # GEOSERVER_CONFIG_FORCE_REINIT=1 or `docker compose down -v geoserver`.
    image: alpine:3.20
    environment:
      GEOSERVER_CONFIG_FORCE_REINIT: "${GEOSERVER_CONFIG_FORCE_REINIT:-0}"
    volumes:
      - "${GEOSERVER_CONFIG_PATH:-../geoserver-config-imas}:/srv/seed:ro"
      - geoserver-data:/data/geoserver
      - ./geoserver:/srv/init:ro
    entrypoint: ["/srv/init/seed-data.sh"]
    restart: "no"

  geoserver:
    # Tomcat 9 + JRE 17 + IMAS WAR. Matches prod's tomcat 9.0.89 / jre-17
    # (imas-data-infrastructure/group_vars/all.yml + data-imas.yml). The WAR
    # comes in from geoserver-fetch; the data dir is seeded from the user's
    # IMASau/geoserver-config-imas clone by geoserver-config-init.
    build:
      context: ./geoserver
    image: seamap-geoserver:dev
    depends_on:
      geoserver-fetch:
        condition: service_completed_successfully
      geoserver-config-init:
        condition: service_completed_successfully
    environment:
      # Heap — prod runs -Xms8G -Xmx8G; this leaner default suits a laptop.
      GEOSERVER_HEAP: "${GEOSERVER_HEAP:--Xms512m -Xmx2g}"
      # Extra -D flags appended to CATALINA_OPTS if you need them.
      GEOSERVER_EXTRA_OPTS: "${GEOSERVER_EXTRA_OPTS:-}"
    ports:
      - "${GEOSERVER_HOST_PORT:-8080}:8080"
    volumes:
      - geoserver-war:/srv/war:ro
      - geoserver-data:/data/geoserver
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:8080/geoserver/web/ > /dev/null || exit 1"
      interval: 15s
      timeout: 5s
      retries: 20
      # WAR explode + data dir scan on first start is slow — give it room.
      start_period: 180s

  # ──────────────────────────────────────────────────────────────────────────
  # WordPress — production Seamap uses WP for "story maps" and "region report"
  # pages. Both are bespoke CPTs (story_map, region_report) registered in PHP
  # by the wordpress/plugins/story-map and wordpress/plugins/region-report
  # plugins; the frontend reads them via the WP REST API (acf_format=standard).
  # See docs/local-dev-docker.md for the authoring workflow.
  wp-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: "${WP_DB_NAME:-wordpress}"
      MARIADB_USER: "${WP_DB_USER:-wordpress}"
      MARIADB_PASSWORD: "${WP_DB_PASSWORD:-wordpress}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - wp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  wordpress:
    image: wordpress:6.6-apache
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_NAME: "${WP_DB_NAME:-wordpress}"
      WORDPRESS_DB_USER: "${WP_DB_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD:-wordpress}"
    ports:
      - "${WP_HOST_PORT:-8888}:80"
    volumes:
      # The official image populates wp-core + wp-content on first start into
      # this named volume so the install survives `docker compose down`.
      - wp-data:/var/www/html
      # Overlay bespoke plugins + child theme on top of the image. Read-only
      # so a wp plugin install inside the container can't mutate in-repo source.
      - ./wordpress/plugins/story-map:/var/www/html/wp-content/plugins/story-map:ro
      - ./wordpress/plugins/region-report:/var/www/html/wp-content/plugins/region-report:ro
      - ./wordpress/plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro:ro
      - ./wordpress/themes/h-code-child:/var/www/html/wp-content/themes/h-code-child:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  acf-fetch:
    image: alpine:3.20
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ACF_PRO_REPO: "${ACF_PRO_REPO:-IMASau/seamap-vendor}"
      ACF_PRO_RELEASE_TAG: "${ACF_PRO_RELEASE_TAG:-acf-pro-6.8.0.1}"
      ACF_PRO_ASSET: "${ACF_PRO_ASSET:-advanced-custom-fields-pro.zip}"
    volumes:
      - ./wordpress/plugins/advanced-custom-fields-pro:/dest
      - ./wordpress/init:/init:ro
    entrypoint: ["/init/fetch-acf-pro.sh"]
    restart: "no"

  wp-init:
    image: wordpress:cli
    depends_on:
      wordpress:
        condition: service_healthy
      acf-fetch:
        condition: service_completed_successfully
    # wp-cli image runs as user 33 (www-data) — matches the apache uid in the
    # wordpress image so file ownership on the shared volume stays consistent.
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_NAME: "${WP_DB_NAME:-wordpress}"
      WORDPRESS_DB_USER: "${WP_DB_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD:-wordpress}"
      WP_URL: "${WP_URL:-http://localhost:8888}"
      WP_TITLE: "${WP_TITLE:-Seamap Local}"
      WP_ADMIN_USER: "${WP_ADMIN_USER:-admin}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD:-admin}"
      WP_ADMIN_EMAIL: "${WP_ADMIN_EMAIL:-admin@example.com}"
    volumes:
      - wp-data:/var/www/html
      # Mirror the bind-mounts from the wordpress service so wp-cli sees the
      # same wp-content/ as Apache does. Without these, `wp plugin activate
      # story-map` errors with "plugin could not be found".
      - ./wordpress/plugins/story-map:/var/www/html/wp-content/plugins/story-map:ro
      - ./wordpress/plugins/region-report:/var/www/html/wp-content/plugins/region-report:ro
      - ./wordpress/plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro:ro
      - ./wordpress/themes/h-code-child:/var/www/html/wp-content/themes/h-code-child:ro
      - ./wordpress/init:/init:ro
    entrypoint: ["/init/bootstrap.sh"]
    restart: "no"

volumes:
  mssql-data:
  frontend-node-modules:
  frontend-shadow-cache:
  geoserver-war:
  geoserver-data:
  wp-db-data:
  wp-data:
